      <details>
        <summary>操作指南</summary>
        <div class="instructions">
          <p><strong>电脑</strong>　WASD 移动，鼠标转动视角，Shift 快走；左键出拳，右键格挡，E 互动。Esc 释放鼠标，R 重新开始。</p>
          <p><strong>手机</strong>　横屏后，左侧摇杆移动，右侧拖动转向；用画面上的按钮出拳、格挡与互动。</p>
          <p>首次进入需要加载 3D 资源，请稍候。建议使用新版 Safari、Chrome 或 Edge。</p>
          <a href="play/?touch=1">手动进入触屏模式 →</a>
        </div>
      </details>
